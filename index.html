<html>

<head>
    <title>My snowglobe</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="hero">
        <h1>mysnowglobe</h1>
        <p class="tagline">Click to recieve a load of cuteness</p>
    </header>
    <main>
        <section class="globe-card">
            <div class="globe" id="globe">
                <img class="scene" src="snowglobe.png" alt="a snowglobe" />
            </div>
            <button id="shake">shake the globe</button>
            <p class="message" id="message">press the button and see what settles</p>
        </section>
    </main>
    <footer>
        <p>made by me, even though I have never experienced the snow</p>
    </footer>
</body>

</html>
